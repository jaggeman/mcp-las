name: Veckovis synk av lagkällor

# scripts/sync_sources.py har funnits sedan projektets start men körts av
# ingen - lagtexten fryser vid den dag ingestionen kördes, vilket är farligt
# eftersom certainty-badgen på varje svar gör inaktuell text aktivt
# vilseledande snarare än bara ofullständig (se issue #17).
#
# Sverige, Danmark, Finland, Norge, Tyskland, Spanien, Nederländerna och Storbritannien.
on:
  schedule:
    # Måndagar 03:00 UTC - efter att helgens ev. lagändringar hunnit synas
    # hos Riksdagen, och långt utanför normal arbetstid.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  sync:
    name: Synka alla åtta lagkataloger
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: legal-source-sync-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Separat OIDC-identitet med databas- och jobbkörningsbehörighet, inga deployroller.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_SYNC_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SYNC_SERVICE_ACCOUNT }}

      # sync_sources.py skriver en JSON-sammanfattning (changed/skipped/errors)
      # till stdout och avslutar med kod 1 om status är "error" - en sådan
      # körning syns som ett rött, misslyckat Actions-jobb och GitHub
      # e-postar det till den som äger repot per sina standardinställningar.
      # Det ÄR larmet acceptanskriterierna i #17 efterfrågar, inget extra
      # behövs.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installera synkberoenden
        run: pip install --require-hashes -r requirements.lock

      - name: Synka svenska lagar
        env:
          FIREBASE_PROJECT_ID: paygap-prod
          EMBEDDING_PROVIDER: mock
        run: python scripts/sync_sources.py --swedish

      - name: Synka lagtext i Frankfurt
        if: ${{ !cancelled() }}
        run: gcloud run jobs execute mcp-las-source-sync --project=paygap-prod --region=europe-west3 --wait
