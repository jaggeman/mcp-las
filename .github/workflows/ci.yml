name: CI / CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # samma som Dockerfile (python:3.11-slim)
          cache: pip

      - name: Installera beroenden
        run: pip install -r requirements.txt

      # Grinden. Körs utan credentials och utan externa tjänster, så ett fel
      # här betyder att koden är trasig - inte att en tredje part ligger nere.
      - name: Kör testsviten
        run: pytest -m "not network" -q

  external-sources:
    name: Externa källor (blockerar inte)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installera beroenden
        run: pip install -r requirements.txt

      # Allt här beror på att Riksdagens API svarar. Det är värdefull signal -
      # särskilt om parsningen slutar fungera efter en lagändring - men en
      # störning hos Riksdagen ska inte hindra en merge, därav
      # continue-on-error ovan.
      - name: Tester mot Riksdagens API
        run: pytest -m network -q

      - name: Lagparagraftäckning
        run: python check_coverage.py

  deploy:
    name: Deploy to Cloud Run & Firebase
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy mcp-las \
            --source . \
            --project=paygap-prod \
            --region=europe-west3 \
            --allow-unauthenticated

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Firebase Hosting
        run: |
          npx firebase-tools deploy --only hosting:mcp-novro --project=paygap-prod
