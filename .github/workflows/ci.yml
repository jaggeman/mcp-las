name: CI / CD

on:
  # PR-triggern filtreras med flit INTE. Grinden ska alltid rapportera, annars
  # blockeras en dok-PR för evigt om "Tester" görs till required check -
  # en overksam kontroll rapporterar aldrig, och PR:en väntar i all evighet.
  pull_request:

  # Push-triggern är den som driver deploy. Ändringar som omöjligt kan påverka
  # det som körs hoppas över här, så en README-redigering inte kostar en
  # tvåminuters Cloud Run-deploy. Ändras både kod och dokumentation i samma
  # push körs den ändå - paths-ignore hoppar bara över när ALLT som ändrats
  # matchar.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  tests:
    name: Tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # samma som Dockerfile (python:3.11-slim)
          cache: pip

      - name: Installera beroenden
        run: pip install -r requirements.txt

      # Grinden. Körs utan credentials och utan externa tjänster, så ett fel
      # här betyder att koden är trasig - inte att en tredje part ligger nere.
      - name: Kör testsviten
        run: pytest -m "not network" -q

  external-sources:
    name: Externa källor (blockerar inte)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installera beroenden
        run: pip install -r requirements.txt

      # Allt här beror på att Riksdagens API svarar. Det är värdefull signal -
      # särskilt om parsningen slutar fungera efter en lagändring - men en
      # störning hos Riksdagen ska inte hindra en merge, därav
      # continue-on-error ovan.
      - name: Tester mot Riksdagens API
        run: pytest -m network -q

      - name: Lagparagraftäckning
        run: python check_coverage.py

  deploy:
    name: Deploy to Cloud Run & Firebase
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # --update-env-vars, inte --set-env-vars: den senare ersätter HELA
      # miljön på tjänsten och skulle radera allt som satts utanför den här
      # filen (hemligheter, provider-val). Den här lägger bara till.
      #
      # BUILD_SHA gör /health till svaret på "kör produktionen det som ligger
      # på main?". Utan den krävdes deployloggar och revisionslistor för att
      # avgöra saken, och två parallella driftsättningar av samma tjänst gick
      # inte att skilja åt utifrån alls.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy mcp-las \
            --source . \
            --project=paygap-prod \
            --region=europe-west3 \
            --allow-unauthenticated \
            --update-env-vars=BUILD_SHA=${{ github.sha }},BUILD_REF=${{ github.ref_name }}

      # Deployen ovan rapporterar "serving 100 percent of traffic" även när
      # trafiken redan låg på en äldre revision, så verifiera mot tjänsten
      # själv att det är det här commitet som svarar.
      - name: Verifiera att den nya koden svarar
        run: |
          URL=$(gcloud run services describe mcp-las \
            --project=paygap-prod --region=europe-west3 \
            --format='value(status.url)')
          echo "Tjänste-URL: $URL"
          for i in 1 2 3 4 5; do
            LIVE=$(curl -fsS --max-time 20 "$URL/health" | python3 -c 'import sys,json; print(json.load(sys.stdin)["build_sha"])' || echo "")
            if [ "$LIVE" = "${{ github.sha }}" ]; then
              echo "OK: $URL/health svarar med ${{ github.sha }}"
              exit 0
            fi
            echo "Försök $i: fick \"$LIVE\", väntade ${{ github.sha }}"
            sleep 10
          done
          echo "Cloud Run svarar inte med det commit som just driftsattes."
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # mcp-endpoint (mcp.novro.se) tillkom i #10 som ett rent additivt alias
      # till las.novro.se — samma public-katalog, samma rewrite mot Cloud Run.
      # Bada maste driftsattas i samma steg, annars glider de isar sig sjalva
      # nasta gang bara en av dem andras.
      - name: Deploy to Firebase Hosting
        run: |
          npx firebase-tools deploy --only hosting:mcp-novro,hosting:mcp-endpoint --project=paygap-prod
