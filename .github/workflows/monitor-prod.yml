name: Produktionsövervakning

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mcp-las-production-monitor
  cancel-in-progress: false

jobs:
  smoke:
    name: MCP, webb, täckning och svarstid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Installera HTTP-klient
        run: pip install "requests>=2.33,<3"
      - name: Kontrollera produktion
        run: python scripts/production_smoke.py --base-url https://las.novro.se --max-response-seconds 10 --all-countries
