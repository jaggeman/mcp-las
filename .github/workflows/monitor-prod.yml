name: Produktionsövervakning

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mcp-las-production-monitor
  cancel-in-progress: false

jobs:
  smoke:
    name: MCP, webb, täckning och svarstid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Installera HTTP-klient
        run: pip install "requests>=2.33,<3"
      - name: Kontrollera produktion
        run: python scripts/production_smoke.py --base-url https://las.novro.se --max-response-seconds 10 --all-countries --check-search-quality
